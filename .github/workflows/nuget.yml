name: Nuget

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    permissions:
      id-token: write
    runs-on: windows-latest

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: login
      with:
          user: ${{ secrets.NUGET_USER }}

    - name: Restore NuGet packages
      run: nuget restore

    - name: Build the application
      run: msbuild /p:Configuration=Release

    - name: Depoly to Nuget
      run: |
           $package = Get-ChildItem -Recurse -Filter *.nupkg
           nuget push $package $env:nuget_api_key -src https://nuget.org
      env:
        nuget_api_key: ${{ steps.login.outputs.NUGET_API_KEY }}
